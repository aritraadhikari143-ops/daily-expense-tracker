<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Expense Tracker</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --danger: #f43f5e;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 20px 14px;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--accent);
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-top: 4px;
        }

        .balance-card {
            background: linear-gradient(135deg, #1e293b, #334155);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .balance-card span {
            font-size: 0.9rem;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .balance-card h2 {
            font-size: 2.2rem;
            color: var(--accent);
            margin-top: 8px;
        }

        .input-card {
            background-color: var(--card-bg);
            padding: 16px;
            border-radius: 14px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #0f172a;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: var(--accent);
        }

        .btn-add {
            width: 100%;
            padding: 12px;
            background-color: var(--accent);
            color: #0f172a;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .btn-add:active {
            transform: scale(0.98);
        }

        .expense-list-title {
            font-size: 1rem;
            color: var(--text-sub);
            margin-bottom: 12px;
            font-weight: 600;
        }

        .expense-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .expense-item {
            background: var(--card-bg);
            padding: 14px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--accent);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-left-width: 4px;
        }

        .expense-info h4 {
            font-size: 0.95rem;
            color: var(--text-main);
            margin-bottom: 2px;
        }

        .expense-info span {
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .expense-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .expense-amount {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text-main);
        }

        .btn-delete {
            background: rgba(244, 63, 94, 0.15);
            color: var(--danger);
            border: none;
            border-radius: 8px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .empty-state {
            text-align: center;
            color: var(--text-sub);
            font-size: 0.85rem;
            padding: 24px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Daily Expense Tracker</h1>
            <p>দৈনিক খরচের হিসাব ও ট্র্যাকিং</p>
        </header>

        <!-- ব্যালেন্স কার্ড -->
        <div class="balance-card">
            <span>মোট খরচ (Total Expense)</span>
            <h2 id="totalAmount">₹0</h2>
        </div>

        <!-- ইনপুট ফর্ম -->
        <div class="input-card">
            <div class="input-group">
                <label>খরচের বিবরণ (Description)</label>
                <input type="text" id="descInput" placeholder="উদাঃ বিরিয়ানি, খাতা, বাস ভাড়া">
            </div>

            <div class="input-group">
                <label>টাকা (Amount in ₹)</label>
                <input type="number" id="amountInput" placeholder="উদাঃ 150">
            </div>

            <div class="input-group">
                <label>ক্যাটাগরি (Category)</label>
                <select id="categoryInput">
                    <option value="খাবার 🍔">খাবার 🍔</option>
                    <option value="পড়াশোনা 📚">পড়াশোনা 📚</option>
                    <option value="যাতায়াত 🚌">যাতায়াত 🚌</option>
                    <option value="অন্যান্য 🛍️">অন্যান্য 🛍️</option>
                </select>
            </div>

            <button class="btn-add" id="addBtn">খরচ যোগ করুন +</button>
        </div>

        <!-- হিস্ট্রি লিস্ট -->
        <div class="expense-list-title">খরচের তালিকা</div>
        <div class="expense-list" id="expenseList">
            <!-- আইটেমগুলো জাভাস্ক্রিপ্ট দিয়ে এখানে তৈরি হবে -->
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // ১. LocalStorage থেকে আগের ডেটা লোড করা
        let expenses = JSON.parse(localStorage.getItem('my_expenses')) || [];

        // ২. DOM এলিমেন্টগুলো ধরা
        const totalAmountEl = document.getElementById('totalAmount');
        const descInput = document.getElementById('descInput');
        const amountInput = document.getElementById('amountInput');
        const categoryInput = document.getElementById('categoryInput');
        const addBtn = document.getElementById('addBtn');
        const expenseList = document.getElementById('expenseList');

        // ৩. UI ও মোট খরচ আপডেট করার মূল ফাংশন
        function renderUI() {
            expenseList.innerHTML = '';

            if (expenses.length === 0) {
                expenseList.innerHTML = '<div class="empty-state">এখনও কোনো খরচ যোগ করা হয়নি!</div>';
                totalAmountEl.textContent = '₹0';
                return;
            }

            // মোট খরচ ক্যালকুলেট করা (Array.reduce)
            const total = expenses.reduce((acc, item) => acc + Number(item.amount), 0);
            totalAmountEl.textContent = `₹${total}`;

            // লিস্টে আইটেম দেখানো
            expenses.forEach((item, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'expense-item';
                itemDiv.innerHTML = `
                    <div class="expense-info">
                        <h4>${item.desc}</h4>
                        <span>${item.category} • ${item.date}</span>
                    </div>
                    <div class="expense-right">
                        <span class="expense-amount">₹${item.amount}</span>
                        <button class="btn-delete" onclick="deleteExpense(${index})">✕</button>
                    </div>
                `;
                expenseList.appendChild(itemDiv);
            });
        }

        // ৪. নতুন খরচ যোগ করার ফাংশন
        function addExpense() {
            const desc = descInput.value.trim();
            const amount = parseFloat(amountInput.value);
            const category = categoryInput.value;

            if (!desc || isNaN(amount) || amount <= 0) {
                alert('অনুগ্রহ করে সঠিক বিবরণ এবং টাকার পরিমাণ লিখুন!');
                return;
            }

            const newExpense = {
                desc: desc,
                amount: amount,
                category: category,
                date: new Date().toLocaleDateString('en-GB')
            };

            expenses.unshift(newExpense); // নতুন আইটেম সবার উপরে যোগ হবে
            saveAndSync();

            // ইনপুট বক্স ফাঁকা করা
            descInput.value = '';
            amountInput.value = '';
        }

        // ৫. খরচ ডিলিট করার ফাংশন
        function deleteExpense(index) {
            expenses.splice(index, 1);
            saveAndSync();
        }

        // ৬. LocalStorage-এ সেভ করা
        function saveAndSync() {
            localStorage.setItem('my_expenses', JSON.stringify(expenses));
            renderUI();
        }

        // ইভেন্ট লিসেনার
        addBtn.addEventListener('click', addExpense);

        // অ্যাপ চালু হলে রেন্ডার করা
        renderUI();
    </script>
</body>
                  </html>
